name: Native build and release

on:
  push:
    branches: ['**']
  pull_request:
    paths:
      - 'native/**'
      - '.github/scripts/**'
      - '.github/workflows/build.yml'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

# No cancel-in-progress group: a later push must not discard an earlier release.
jobs:
  plan:
    if: github.event_name != 'push' || github.event.deleted == false
    runs-on: ubuntu-latest
    outputs:
      commits: ${{ steps.plan.outputs.commits }}
      has_commits: ${{ steps.plan.outputs.has_commits }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test release automation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Select app commits
        id: plan
        run: python3 .github/scripts/native_release.py plan

  validate:
    if: github.event_name == 'pull_request'
    needs: plan
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: bash native/test.sh
      - name: Build universal application
        run: APPLEBLOX_UNIVERSAL=1 bash native/build.sh

  release:
    if: github.event_name != 'pull_request' && needs.plan.outputs.has_commits == 'true'
    needs: plan
    runs-on: xcode-27
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    timeout-minutes: 360
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test, build, and publish each app commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMITS: ${{ needs.plan.outputs.commits }}
        run: python3 .github/scripts/native_release.py release
      - name: Keep release packages on failed runs too
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-release-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-packages/
          if-no-files-found: ignore
          retention-days: 14
